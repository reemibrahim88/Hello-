<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe3e3 50%, #ffd8cc 100%);
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Floating background hearts animation */
        .bg-heart {
            position: absolute;
            color: rgba(255, 154, 162, 0.35);
            animation: floatUp 8s infinite linear;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Envelope CSS Animation & Styling */
        .envelope-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 190px;
            background-color: #ffb8b8;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.25);
            transform-style: preserve-3d;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        @media (min-width: 640px) {
            .envelope {
                width: 340px;
                height: 230px;
            }
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background-color: #ff9999;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            border-radius: 12px 12px 0 0;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70%;
            background-color: #ffa3a3;
            clip-path: polygon(0 100%, 100% 100%, 100% 20%, 50% 70%, 0 20%);
            z-index: 2;
            border-radius: 0 0 16px 16px;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            background-color: #ff8585;
            border-radius: 16px;
            z-index: 1;
        }

        .envelope-seal {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #ff4d6d, #d90429);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.4);
            z-index: 4;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Open Envelope Animation State */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .envelope-seal {
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
        }

        .envelope-wrapper.open .letter-preview {
            transform: translateY(-60px) scale(1.05);
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Breathing effect for sleeping cat */
        @keyframes breathing {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.03, 0.97) translateY(-2px); }
        }

        .cat-breathing {
            animation: breathing 3.5s ease-in-out infinite;
            transform-origin: bottom center;
        }

        /* Tail wiggle animation */
        @keyframes tailWiggle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(12deg); }
        }

        .tail-anim {
            animation: tailWiggle 3s ease-in-out infinite;
            transform-origin: 10% 80%;
        }

        /* Floating Zzz animations */
        @keyframes floatZ {
            0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translate(25px, -45px) scale(1.2); opacity: 0; }
        }

        .zzz-1 { animation: floatZ 3s infinite ease-out; animation-delay: 0s; }
        .zzz-2 { animation: floatZ 3s infinite ease-out; animation-delay: 1s; }
        .zzz-3 { animation: floatZ 3s infinite ease-out; animation-delay: 2s; }

        /* Ears twitching */
        @keyframes earTwitch {
            0%, 90%, 100% { transform: rotate(0deg); }
            93% { transform: rotate(-6deg); }
            96% { transform: rotate(4deg); }
        }
        .ear-left { animation: earTwitch 6s infinite; transform-origin: bottom right; }

        /* Button glow effect */
        .btn-glow {
            box-shadow: 0 8px 25px -4px rgba(255, 107, 129, 0.5);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
        }
        .btn-glow:active {
            transform: scale(0.95);
        }

        /* Dodging button styling */
        #no-btn {
            transition: left 0.18s ease-out, top 0.18s ease-out, transform 0.15s ease;
            z-index: 50;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Paw print animation */
        .paw-print {
            position: absolute;
            width: 28px;
            height: 28px;
            opacity: 0;
            transform: scale(0.2) rotate(0deg);
            animation: pawPop 0.5s forwards ease-out;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes pawPop {
            0% { opacity: 0; transform: scale(0.2) rotate(-15deg); }
            70% { opacity: 1; transform: scale(1.15) rotate(5deg); }
            100% { opacity: 0.9; transform: scale(1) rotate(0deg); }
        }

        /* Running cat animation overlay */
        #running-cat {
            position: fixed;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 30;
            display: none;
            transform: translate(-50%, -50%);
        }

        /* Giant Kissing Cat Overlay */
        #kiss-cat-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.2);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease-in-out;
        }

        #kiss-cat-overlay.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Smooch Heart Pop */
        .kiss-heart {
            position: absolute;
            animation: kissHeartPop 1.2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes kissHeartPop {
            0% { transform: scale(0.2) translate(0, 0) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5) translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
        }
    </style>
</head>

    <script>
        // Current state tracker
        let currentStep = 1;
        let isSoundOn = true;

        // Audio Context initialization for sound effects without external audio files
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound() {
            if (!isSoundOn) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) { console.log(e); }
        }

        function playMeowSound() {
            if (!isSoundOn) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
            } catch (e) { console.log(e); }
        }

        function playKissSound() {
            if (!isSoundOn) return;
            initAudio();
            try {
                const bufferSize = audioCtx.sampleRate * 0.25;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(3200, audioCtx.currentTime + 0.12);
                filter.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.22);
                filter.Q.value = 4;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.24);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
                noise.stop(audioCtx.currentTime + 0.25);
            } catch (e) { console.log(e); }
        }

        // Open Envelope transition logic
        function openEnvelope() {
            initAudio();
            playPopSound();

            const envCard = document.getElementById('envelope-card');
            const envScreen = document.getElementById('envelope-screen');
            const mainCard = document.getElementById('main-card');

            envCard.classList.add('open');

            setTimeout(() => {
                envScreen.classList.add('opacity-0', 'scale-90');
                
                setTimeout(() => {
                    envScreen.classList.add('hidden');
                    mainCard.classList.remove('hidden');
                    
                    // Trigger fade in for main card
                    requestAnimationFrame(() => {
                        mainCard.classList.remove('opacity-0', 'scale-90');
                        mainCard.classList.add('opacity-100', 'scale-100');
                    });
                }, 400);
            }, 600);
        }

        // Generate floating background hearts
        function createBackgroundHearts() {
            const container = document.getElementById('bg-hearts-container');
            const heartIcons = ['❤️', '💖', '✨', '🌸', '💕'];
            
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 8}s`;
                heart.style.fontSize = `${14 + Math.random() * 20}px`;
                container.appendChild(heart);
            }
        }

        let lastDodgeTime = 0;

        function dodgeNoButton() {
            const now = Date.now();
            if (now - lastDodgeTime < 80) return;
            lastDodgeTime = now;

            playPopSound();
            const noBtn = document.getElementById('no-btn');
            
            const margin = 20;
            const btnWidth = noBtn.offsetWidth || 90;
            const btnHeight = noBtn.offsetHeight || 40;

            const maxX = Math.max(margin, window.innerWidth - btnWidth - margin);
            const maxY = Math.max(margin, window.innerHeight - btnHeight - margin);

            const randomX = Math.floor(Math.random() * (maxX - margin)) + margin;
            const randomY = Math.floor(Math.random() * (maxY - margin)) + margin;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            const yesBtn = document.getElementById('yes-btn');
            const currentScale = parseFloat(yesBtn.getAttribute('data-scale') || '1.0');
            if (currentScale < 1.45) {
                const newScale = currentScale + 0.05;
                yesBtn.setAttribute('data-scale', newScale);
                yesBtn.style.transform = `scale(${newScale})`;
            }
        }

        function checkProximityAndDodge(clientX, clientY) {
            const noBtn = document.getElementById('no-btn');
            if (!noBtn || noBtn.offsetParent === null) return;

            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            const distance = Math.hypot(clientX - btnCenterX, clientY - btnCenterY);

            if (distance < 85) {
                dodgeNoButton();
            }
        }

        const noBtn = document.getElementById('no-btn');

        noBtn.addEventListener('mouseover', dodgeNoButton);
        noBtn.addEventListener('mouseenter', dodgeNoButton);

        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            initAudio();
            dodgeNoButton();
        }, { passive: false });

        noBtn.addEventListener('pointerdown', function(e) {
            if (e.pointerType === 'touch') {
                e.preventDefault();
                dodgeNoButton();
            }
        });

        window.addEventListener('touchmove', function(e) {
            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[0];
                checkProximityAndDodge(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        window.addEventListener('mousemove', function(e) {
            checkProximityAndDodge(e.clientX, e.clientY);
        });

        function handleYesClick() {
            initAudio();
            playMeowSound();

            if (currentStep === 1) {
                currentStep = 2;

                const mainTitle = document.getElementById('main-title');
                const subTitle = document.getElementById('sub-title');
                
                mainTitle.innerHTML = 'Are You Sure? 🥹💖';
                subTitle.innerText = 'Think carefully... Kitty wants your whole heart!';

                document.getElementById('zzz-container').style.display = 'none';
                document.getElementById('eyes-sleeping').style.display = 'none';
                document.getElementById('eyes-awake').style.display = 'block';

                const noBtn = document.getElementById('no-btn');
                noBtn.style.position = 'static';

                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#ff85a1', '#fbb1bd', '#fec5bb']
                });

            } else if (currentStep === 2) {
                currentStep = 3;
                triggerFinalCelebration();
            }
        }

        function triggerFinalCelebration() {
            document.getElementById('main-title').innerHTML = 'I Knew It! Love You! 🐾❤️';
            document.getElementById('sub-title').innerText = 'You made kitty the happiest in the whole world!';
            
            document.getElementById('forever-note').classList.remove('hidden');
            document.getElementById('button-container').style.display = 'none';
            document.getElementById('replay-container').classList.remove('hidden');

            const duration = 3.5 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff7675', '#fd79a8', '#e84393', '#ffb8b8']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff7675', '#fd79a8', '#e84393', '#ffb8b8']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();

            animateCatHeartPath(() => {
                setTimeout(showCatKissCloseUp, 300);
            });
        }

        function animateCatHeartPath(onComplete) {
            const runner = document.getElementById('running-cat');
            const container = document.getElementById('heart-canvas-container');
            runner.style.display = 'block';

            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2 - 20;

            const points = [];
            const steps = 32;
            const scale = Math.min(width, height) / 32;

            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                points.push({
                    x: centerX + x * scale,
                    y: centerY + y * scale
                });
            }

            let index = 0;

            function stepCat() {
                if (index >= points.length) {
                    runner.style.display = 'none';
                    if (onComplete) onComplete();
                    return;
                }

                const pt = points[index];
                runner.style.left = `${pt.x}px`;
                runner.style.top = `${pt.y}px`;

                createPawPrint(container, pt.x, pt.y);

                index++;
                setTimeout(stepCat, 75);
            }

            stepCat();
        }

        function showCatKissCloseUp() {
            const overlay = document.getElementById('kiss-cat-overlay');
            overlay.classList.add('active');

            playKissSound();
            spawnKissHearts();

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2800);
        }

        function spawnKissHearts() {
            const kissIcons = ['💋', '💖', '💕', '✨', '❤️', '🌸'];
            const overlay = document.getElementById('kiss-cat-overlay');

            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'kiss-heart text-2xl sm:text-4xl';
                    heart.innerText = kissIcons[Math.floor(Math.random() * kissIcons.length)];
                    
                    const dx = (Math.random() - 0.5) * 300 + 'px';
                    const dy = (Math.random() - 0.5) * 300 + 'px';
                    const rot = (Math.random() - 0.5) * 90 + 'deg';

                    heart.style.setProperty('--dx', dx);
                    heart.style.setProperty('--dy', dy);
                    heart.style.setProperty('--rot', rot);
                    heart.style.left = '50%';
                    heart.style.top = '50%';

                    overlay.appendChild(heart);

                    setTimeout(() => heart.remove(), 1200);
                }, i * 70);
            }
        }

        function createPawPrint(container, x, y) {
            const paw = document.createElement('div');
            paw.className = 'paw-print';
            paw.style.left = `${x - 14}px`;
            paw.style.top = `${y - 14}px`;

            paw.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full fill-pink-400 opacity-80">
                    <path d="M 50 45 C 35 45, 25 60, 35 78 C 43 88, 57 88, 65 78 C 75 60, 65 45, 50 45 Z" />
                    <circle cx="25" cy="38" r="8" />
                    <circle cx="40" cy="25" r="9" />
                    <circle cx="60" cy="25" r="9" />
                    <circle cx="75" cy="38" r="8" />
                </svg>
            `;

            container.appendChild(paw);
        }

        function resetFlow() {
            currentStep = 1;

            document.getElementById('main-title').innerHTML = 'Do You Love Me? <span class="inline-block animate-bounce">🐱❤️</span>';
            document.getElementById('sub-title').innerText = 'Please answer honestly... the kitty is waiting!';
            document.getElementById('forever-note').classList.add('hidden');

            document.getElementById('zzz-container').style.display = 'block';
            document.getElementById('eyes-sleeping').style.display = 'block';
            document.getElementById('eyes-awake').style.display = 'none';

            document.getElementById('kiss-cat-overlay').classList.remove('active');

            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            
            noBtn.style.position = 'static';
            yesBtn.style.transform = 'scale(1)';
            yesBtn.setAttribute('data-scale', '1.0');

            document.getElementById('button-container').style.display = 'flex';
            document.getElementById('replay-container').classList.add('hidden');

            document.getElementById('heart-canvas-container').innerHTML = '';
        }

        window.onload = function() {
            createBackgroundHearts();
            document.body.addEventListener('touchstart', initAudio, { once: true });
            document.body.addEventListener('click', initAudio, { once: true });
        };
    </script>
</body>
